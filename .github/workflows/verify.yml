name: Verify CargoIQ
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Fail on high or critical vulnerabilities in any dependency (dev included).
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      # Lint is a required gate: eslint errors (incl. no-explicit-any) fail the build.
      - run: npm run lint
      - run: npm test
      - run: node scripts/verification/atomic-pack-check.mjs
      - run: node scripts/verification/brenda-registers-check.mjs
      # All ten database test scripts (PGlite, no external services): the green gate
      # requires every one on every push, not only the two verification checks.
      - run: node scripts/app-errors-bounds-test.mjs
      - run: node scripts/batched-clock-test.mjs
      - run: node scripts/extraction-rpc-test.mjs
      - run: node scripts/free-cap-test.mjs
      - run: node scripts/guard-test.mjs
      - run: node scripts/platform-admin-test.mjs
      - run: node scripts/provisioning-test.mjs
      - run: node scripts/rls-test.mjs
      - run: node scripts/spend-reservation-test.mjs
      - run: node scripts/tenant-caps-test.mjs
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
