name: Verify CargoIQ
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test
      - run: node scripts/verification/atomic-pack-check.mjs
      - run: node scripts/verification/brenda-registers-check.mjs
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
